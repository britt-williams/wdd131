<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Education Learning Journal</title>
    <meta name="description"
        content="WDD 131 – Dynamic Web Fundamentals - Brittany Williams - Home Education Learning Record Project">
    <meta name="author" content="Brittany Williams">
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/full-site.js" defer></script>
    <script src="scripts/journal-page.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div>
            <img class="logo" src="images/journal-logo-white.png"
                alt="Logo of a cartoon computer screen sitting between an open book with the words The Home Learning Journal underneath"
                width="250" height="250">
            <button id="menu" aria-label="Navigation Menu"></button>
        </div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="record.html">Record Learning</a></li>
                <li><a href="journal.html" class="active">Journal</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Our Learning Journal</h1>
        <p class="journal-explanation">Journal entries will appear below. You can filter your entries using the
            selections for child, curriculum
            area and/or dates.</p>

        <div class="filter-categories">
            <div class="filter-group">
                <label for="filter-child">Filter by Child:</label>
                <select id="filter-child">
                    <option value="all">All Children</option>
                    <option value="nephi">Nephi</option>
                    <option value="alma">Alma</option>
                    <option value="sam">Sam</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-curriculum-area">Filter by Area:</label>
                <select id="filter-curriculum-area" class="filter-curriculum-area" name="filter-curriculum-area">
                    <option value="all" selected>All Curriculum Areas</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="date-from">Date From:</label>
                <input type="date" id="date-from">
            </div>

            <div class="filter-group">
                <label for="date-to">Date To:</label>
                <input type="date" id="date-to">
            </div>
        </div>

        <div id="journal-entries"></div>

    </main>

    <footer>
        <p>&copy; <span id="year"></span> Brittany Williams | Australia</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
