<body>
    <header>
        <div>
            <img class="logo" src="images/journal-logo-white.png"

            <button id="menu" aria-label="Navigation Menu"></button>

        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/hero-image.jpg" alt="A table with puzzles, colouring in pencils and wooden blocks.">
            <article>
                <h1>Welcome to the Home Learning Journal!</h1>
                <p>A place to record your family's learning while you live it.</p>
                <a href="record.html" class="record-button">Record My Learning!</a>
            </article>
        </div>
        <div class="features">
            <section class="feature1">
                <figure>
                    <h2>What does learning look like?</h2>
                    <p>Learning is not just sitting down in a classroom completing set worksheets or guided lessons.</p>
                    <p>Learning happens all the time.
                    <p>You're in the supermarket and your child is reading the prices on the shelves, or working out
                        which item is better
                        value for money. You could be attending a trampoline park and they could observe whether
                        having arms out or in
                        make it easier to bounce. Here's an example:</p>
                    <p class="activity-title"><span>Baking cupcakes:</span></p>
                    <ul>
                        <li>Reading the recipe with ingredients and method <span>(language arts)</span>.</li>
                        <li>Measuring ingredients <span>(mathematics)</span>.</li>
                        <li>Mixing ingredients together <span>(science)</span>.</li>
                        <li>Eating them afterwards <span>(food technology & health)</span>.</li>
                        <li>Talking about moderation with sugar <span>(health)</span>.</li>
                    </ul>
                    <p>Sometimes instead of trying to fit life around the curriculum areas & education, you can fit the
                        learning/curriculum areas into your life!</p>
                    <p>As you start noticing the big learning moments in your day it will become much easier to notice
                        all the small ones too.</p>
                    <a href="record.html" class="button">Add Our Learning</a>
                </figure>
            </section>
            <section class="feature2">
                <figure>
                    <h2>How does the Learning Journal work?</h2>
                    <p>We know what it's like when you're living life, exploring and completing normal daily tasks, only
                        to realise that you haven't done any "learning" that day! But don't worry - learning happens all
                        the time and we want to make it as easy as possible to record for future reference.</p>
                    <p>Grab your device (phone, tablet, laptop) and fill in the form with a few details, hit save and
                        you are free to carry on with your day.</p>
                    <p>Each entry can take as little as 5mins - depending on the detail you want to add. You can fill it
                        in throughout the day or leave it till the end and do a few at a time - it's completely up to
                        you!</p>
                    <a href="journal.html" class="button">View Our Journal</a>
                </figure>
            </section>
        </div>
    </main>
