<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Education Recording Learning Form</title>
    <meta name="description"
        content="WDD 131 – Dynamic Web Fundamentals - Brittany Williams - Home Education Learning Record Project">
    <meta name="author" content="Brittany Williams">
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/full-site.js" defer></script>
    <script src="scripts/record-page.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div>
            <img class="logo" src="images/journal-logo-white.png"
                alt="Logo of a cartoon computer screen sitting between an open book with the words The Home Learning Journal underneath"
                width="250" height="250">
            <button id="menu" aria-label="Navigation Menu"></button>
        </div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="record.html" class="active">Record Learning</a></li>
                <li><a href="journal.html">Journal</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Record Your Learning</h1>

        <form method="get" action="journal.html" class="record-form">
            <div class="required">* required fields</div>

            <label for="learning-date">Date of Learning*
                <input type="date" id="learning-date" name="learning-date" required></label>

            <fieldset class="children">
                <legend>Which child participated in the learning?* <span>(Select at least one)</span></legend>
                <label for="nephi"><input type="checkbox" id="nephi" class="children" name="children" value="nephi">
                    Nephi</label>
                <label for="alma"><input type="checkbox" id="alma" class="children" name="children" value="alma">
                    Alma</label>
                <label for="sam"><input type="checkbox" id="sam" class="children" name="children" value="sam">
                    Sam</label>
                <p id="child-error" role="alert"></p>
            </fieldset>

            <fieldset class="areas-of-learning">
                <legend>Areas of Learning: <span>(Select up to three)</span></legend>
                <select id="curriculum-area-1" class="curriculum-area" name="curriculum-area"
                    aria-label="Curriculum area 1" required>
                    <option value="" selected>Select a curriculum area: </option>
                </select>
                <select id="curriculum-area-2" class="curriculum-area" name="curriculum-area"
                    aria-label="Curriculum area 2">
                    <option value="" selected>Select a curriculum area: </option>
                </select>
                <select id="curriculum-area-3" class="curriculum-area" name="curriculum-area"
                    aria-label="Curriculum area 3">
                    <option value="" selected>Select a curriculum area: </option>
                </select>
            </fieldset>

            <label for="learning-statement">What did we do today?
                <textarea id="learning-statement" name="learning-statement"></textarea></label>

            <input type="submit" value="Save Learning Record">
            <p id="save-message" role="status"></p>
        </form>

    </main>

    <footer>
        <p>&copy; <span id="year"></span> Brittany Williams | Australia</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
