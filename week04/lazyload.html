<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Example</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Lazy Loading Example</h1>
        <img src="/images/quokka-small.webp" alt="Quokka animal" loading="lazy" width="400" height="600">
        <img src="/images/perth-city-dusk-large.webp" alt="Perth City at Dusk" loading="lazy" width="400" height="600">
        <img src="/images/hamilton_nz_temple.jpeg" alt="Hamilton NZ Temple" loading="lazy" width="400" height="600">
        <img src="/images/Canals-of-Amsterdam-scaled.jpg" alt="Canals of Amsterdam" loading="lazy" width="400" height="600">
        <img src="/images/kirtland_temple.jpeg" alt="Kirtland Temple" loading="lazy" width="400" height="600">
        <img src="/images/auckland_nz_temple.jpeg" alt="Auckland Nz Temple" loading="lazy" width="400" height="600">
    </main>
    <footer>
        <p>&copy; <span id="year"></span> Brittany Williams | Australia</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
