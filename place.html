<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 Place "Perth" Page Assignment - Brittany Williams</title>
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals - Brittany Williams - Place Page for Perth">
    <meta name="author" content="Brittany Williams">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Story+Script&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Perth, Australia</h1>
    </header>
    <main>
        <picture class="hero">
            <source srcset="images/perth-city-dusk-small.webp" media="(max-width: 600px)">
            <img src="images/perth-city-dusk-large.webp" alt="Perth City at Dusk" width="1500" height="750">
        </picture>
        <section class="data">
            <h2>Data</h2>
            <dl>
                <dt>Area:</dt>
                <dd>6,420 sq km</dd>

                <dt>Population:</dt>
                <dd>2.45 million</dd>

                <dt>Language:</dt>
                <dd>English</dd>

                <dt>Currency:</dt>
                <dd>Australian Dollar</dd>

                <dt>Timezone:</dt>
                <dd>UTC+8</dd>

                <dt>Calling Code:</dt>
                <dd>+61</dd>
            </dl>
        </section>
        <section class="weather">
            <h2>Weather</h2>
            <img class="weather-icon" src="images/weather-icon-sun.svg" alt="Sun symbol">
            <dl>
                <dt>Temperature:</dt>
                <dd>21°C</dd>

                <dt>Conditions:</dt>
                <dd>Sunny</dd>

                <dt>Wind:</dt>
                <dd>8 km/h</dd>

                <dt>Wind Chill:</dt>
                <dd id="windChill">...</dd>
            </dl>
        </section>
    </main>
    <footer>
        <p>&copy; <span id="year"></span>🔹 Brittany Williams 🔹 Australia</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
